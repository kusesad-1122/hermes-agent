<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <!-- Progressive Web App: makes the dashboard installable to a phone
         home screen (standalone window + app icon), no app store or APK
         needed. See docs/android/使用指南.zh-CN.md and public/hermes-sw.js. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0b0f10" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Hermes" />
    <link rel="apple-touch-icon" href="/icons/hermes-icon-1024.png" />
    <title>Hermes Agent - Dashboard</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // NOTE: the PWA service worker is intentionally NOT registered anymore.
      // Its asset caching caused stale UI during rapid on-device iteration
      // (rebuild → reload still showed the old build). Instead, actively
      // unregister any previously-installed worker and drop its caches so the
      // app always loads fresh from the server. "Add to Home Screen" still
      // works without a service worker.
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker
          .getRegistrations()
          .then(function (regs) {
            regs.forEach(function (r) {
              r.unregister();
            });
          })
          .catch(function () {});
      }
      if (window.caches && caches.keys) {
        caches
          .keys()
          .then(function (keys) {
            keys.forEach(function (k) {
              if (k.indexOf("hermes-pwa-") === 0) caches.delete(k);
            });
          })
          .catch(function () {});
      }
    </script>
  </body>
</html>
